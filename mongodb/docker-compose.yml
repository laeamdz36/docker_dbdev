name: ${COMPOSE_PROJECT_NAME:-mongodb-dev}

services:
  mongodb:
    image: mongo:${MONGO_IMAGE_TAG:-8.0}
    container_name: ${MONGO_CONTAINER_NAME:-mongodb-dev}
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-password}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-app}
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    networks:
      default:
        aliases:
          - mongo
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1 --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval "db.adminCommand('ping').ok" | grep 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo-express:
    image: mongo-express:${MONGO_EXPRESS_IMAGE_TAG:-1.0.2}
    container_name: ${MONGO_EXPRESS_CONTAINER_NAME:-mongo-express-dev}
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_URL: ${ME_CONFIG_MONGODB_URL:-mongodb://admin:password@mongodb:27017/?authSource=admin}
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_BASICAUTH_ENABLED: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD:-password}
      ME_CONFIG_SITE_COOKIESECRET: ${MONGO_EXPRESS_COOKIE_SECRET:-change-this-cookie-secret}
      ME_CONFIG_SITE_SESSIONSECRET: ${MONGO_EXPRESS_SESSION_SECRET:-change-this-session-secret}
    ports:
      - "${MONGO_EXPRESS_HOST_PORT:-8081}:8081"
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider --quiet http://127.0.0.1:8081/status || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongodb_data:
    name: ${MONGO_VOLUME_NAME:-mongodb_data}
